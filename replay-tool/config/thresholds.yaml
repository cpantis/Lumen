# .lumen Replay — single source of truth for requirement thresholds.
#
# The same file is read by the web app (Requirements view, threshold lines on plots,
# violation shading on the timeline) and by the CLI (`npm run metrics -- file.mcap`),
# and is meant to be read by the automatic test scripts of sub-challenge 2.4.
#
# Profiles:
#   derived — values derived from what the component does today (2.2)
#   strict  — values the final product should meet, justified by user safety (2.5)
#
# Selectors pick topics using the *effective* classification (auto + user edits):
#   role: input | output      fov: <fov name>      type: <regex>     topic: <regex>
#
# Placeholders: the derived values below are starting points; use
# "Requirements → Regenerate derived from measurements" in the app to fit them to
# the recording, then copy the exported YAML back here.

version: 1
gap_factor: 2 # gap = interval > gap_factor × median period
plausible_ranges:
  depthMin: 0.1 # m — closer than this is physically implausible for the cameras
  depthMax: 40 # m — beyond this, stereo/learned depth is not trustworthy outdoors
  accMax: 50 # m/s² — |a| above this is a sensor glitch for a walking person
  gyroMax: 20 # rad/s
assumptions:
  walking_speed_mps: 1.4 # used when the IMU cannot provide an estimate
  step_length_m: 0.7

requirements:
  - id: REQ-IN-01
    title: Camera inputs are published at a constant rate
    title_ro: Intrările de cameră sunt publicate la o frecvență constantă
    kind: rate_min
    select: { role: input, type: "Image|CompressedImage" }
    safety: true
    verification: Automatic analysis — rate over a 1 s sliding window, evaluated at every message
    rationale: Without input frames the component has nothing to process; any drop propagates to the outputs.
    derived: { min_hz: 10, window_s: 1 }
    strict: { min_hz: 15, window_s: 1 }

  - id: REQ-OUT-01
    title: Every output is published at a minimum rate
    title_ro: Fiecare ieșire este publicată cu o frecvență minimă
    kind: rate_min
    select: { role: output }
    safety: true
    verification: Automatic analysis — rate over a 1 s sliding window
    rationale: At 1.4 m/s, every 100 ms without output means 14 cm walked without new information.
    derived: { min_hz: 5, window_s: 1 }
    strict: { min_hz: 10, window_s: 1 }

  - id: REQ-OUT-02
    title: No gap between two consecutive outputs exceeds the limit
    title_ro: Niciun gol între două ieșiri consecutive nu depășește limita
    kind: gap_max
    select: { role: output }
    safety: true
    verification: Automatic analysis — interval between consecutive messages
    rationale: The maximum gap is the time the user walks "blind"; 300 ms ≈ 42 cm at 1.4 m/s.
    derived: { max_ms: 500 }
    strict: { max_ms: 200 }

  - id: REQ-LAT-01
    title: End-to-end latency (input stamp → output publication) is bounded
    title_ro: Latența cap-coadă (stamp intrare → publicare ieșire) este limitată
    kind: latency
    select: { role: output }
    safety: true
    verification: Automatic analysis — log_time(output) − header.stamp(exactly matched input)
    rationale: An obstacle is reported from where the user was `latency` seconds ago; 150 ms ≈ 21 cm.
    derived: { p95_ms: 250, max_ms: 400 }
    strict: { p95_ms: 100, max_ms: 150 }

  - id: REQ-TRACE-01
    title: Every output carries the stamp of the input frame it was produced from
    title_ro: Fiecare ieșire poartă stamp-ul cadrului de intrare din care provine
    kind: match_min
    select: { role: output }
    safety: false
    verification: Automatic analysis — exact header.stamp match with an input
    rationale: Without traceability, latency and consistency cannot be verified.
    derived: { min_ratio: 0.95 }
    strict: { min_ratio: 1.0 }

  - id: REQ-DROP-01
    title: The component does not skip input frames
    title_ro: Componenta nu sare cadre de intrare
    kind: drop_max
    select: { role: output }
    safety: true
    verification: Automatic analysis — input frames without any output carrying the same stamp
    rationale: Long runs of skipped frames are perception gaps.
    derived: { max_ratio: 0.2, max_run: 5 }
    strict: { max_ratio: 0.05, max_run: 2 }

  - id: REQ-CONT-01
    title: Outputs are not empty
    title_ro: Ieșirile nu sunt goale
    kind: empty_max
    select: { role: output }
    safety: true
    verification: Automatic analysis — messages with 0 points / 0 pixels / empty payload
    rationale: An empty message may be interpreted as "path clear".
    derived: { max_ratio: 0.02 }
    strict: { max_ratio: 0.0 }

  - id: REQ-CONT-02
    title: Messages are structurally valid and decodable
    title_ro: Mesajele sunt valide structural și decodabile
    kind: invalid_max
    select: {}
    safety: true
    verification: Automatic analysis — decoding + structural checks (data length, NaN in IMU)
    rationale: A corrupt message is as dangerous as a missing one, but harder to detect.
    derived: { max_ratio: 0.0 }
    strict: { max_ratio: 0.0 }

  - id: REQ-CONT-03
    title: The NaN/Inf ratio per output message is bounded
    title_ro: Proporția de valori NaN/Inf per mesaj de ieșire este limitată
    kind: nan_max
    select: { role: output }
    safety: false
    verification: Automatic analysis — NaN/Inf per message
    rationale: NaNs reduce coverage; above the threshold the area can no longer be considered perceived.
    derived: { max_ratio: 0.5 }
    strict: { max_ratio: 0.2 }

  - id: REQ-CONT-04
    title: Coverage (valid values) per output message is sufficient
    title_ro: Acoperirea (valori valide) per mesaj de ieșire este suficientă
    kind: valid_min
    select: { role: output }
    safety: true
    verification: Automatic analysis — 1 − NaN − zero, per message
    rationale: A message with 10% valid values shows almost nothing of the scene.
    derived: { min_ratio: 0.3 }
    strict: { min_ratio: 0.6 }

  - id: REQ-CONT-05
    title: Values are within physically plausible ranges
    title_ro: Valorile sunt în intervale fizic plauzibile
    kind: out_of_range_max
    select: {}
    safety: false
    verification: Automatic analysis — finite values outside plausible_ranges
    rationale: Distances of 300 m or accelerations of 200 m/s² indicate computation or sensor errors.
    derived: { max_ratio: 0.05 }
    strict: { max_ratio: 0.01 }

  - id: REQ-CONT-06
    title: Outputs do not freeze (identical repeated frames)
    title_ro: Ieșirile nu îngheață (cadre identice repetate)
    kind: duplicate_max
    select: { role: output }
    safety: true
    verification: Automatic analysis — content hash identical to the previous message
    rationale: A frozen output looks valid but describes an old scene.
    derived: { max_ratio: 0.05, max_run: 3 }
    strict: { max_ratio: 0.0, max_run: 1 }

  - id: REQ-CLK-01
    title: header.stamp is monotonically increasing and not in the future
    title_ro: header.stamp este monoton crescător și nu vine din viitor
    kind: stamp_monotonic
    select: {}
    safety: false
    verification: Automatic analysis — stamp[i] ≥ stamp[i−1] and stamp ≤ log_time
    rationale: Wrong stamps invalidate synchronisation and latency measurement.
    derived: { allow_duplicates: true }
    strict: { allow_duplicates: false }

  - id: REQ-CLK-02
    title: Input transport delay (log_time − stamp) is bounded
    title_ro: Întârzierea de transport a intrărilor (log_time − stamp) este limitată
    kind: clock_offset_max
    select: { role: input }
    safety: false
    verification: Automatic analysis — 95th percentile of log_time − header.stamp
    rationale: Contributes directly to the total latency experienced by the user.
    derived: { p95_ms: 100 }
    strict: { p95_ms: 30 }

  - id: REQ-FOV-01
    title: Outputs of the same FOV describe the same moment and appear together
    title_ro: Ieșirile aceluiași FOV descriu același moment și apar împreună
    kind: fov_sync
    select: {}
    safety: false
    verification: Automatic analysis — grouping by stamp; all outputs present, bounded publication spread
    rationale: Outputs inconsistent in time may describe different scenes (2.3).
    derived: { min_complete_ratio: 0.9, max_spread_ms: 50 }
    strict: { min_complete_ratio: 0.99, max_spread_ms: 10 }
