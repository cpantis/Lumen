<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="StampTrace — synchronised replay & test analysis for MCAP recordings. By Calin Pantis." />
    <meta name="author" content="Calin Pantis" />
    <title>StampTrace — Synchronised replay & test analysis for MCAP recordings</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem("lumen.prefs") || "{}");
        var theme = s.theme || "dark"; // dark by default, like dotlumen.com
        document.documentElement.dataset.theme = theme;
        if (s.highContrast) document.documentElement.dataset.contrast = "high";
        if (s.lang) document.documentElement.lang = s.lang;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
